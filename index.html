<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AD-INTEL</title>
<style>
  :root{--bg:#f4f2ee;--card:#fff;--ink:#16140f;--muted:#6b665c;--line:#ddd8cd;--accent:#16140f;--err:#b42318}
  @media (prefers-color-scheme:dark){:root{--bg:#121110;--card:#1c1b19;--ink:#f1eee7;--muted:#9a958a;--line:#33312c;--accent:#f1eee7;--err:#f97066}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
  h1{margin:0 0 4px;font-size:20px;letter-spacing:.04em}
  p{margin:0 0 20px;color:var(--muted);font-size:14px}
  input[type=password]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
  label{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:14px;color:var(--muted)}
  button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:20px;margin:12px 0 0;font-size:14px}
  .msg.err{color:var(--err)}
</style></head>
<body>
<form id="f" autocomplete="on">
  <h1>AD-INTEL</h1>
  <p>Updated 31 Oct 2026, 12:20 (Lagos)</p>
  <input type="text" name="username" value="ad-intel" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <label><input id="rem" type="checkbox" checked> Remember this device for 30 days</label>
  <button id="go">Open dashboard</button>
  <div id="msg" class="msg"></div>
</form>
<script>
(()=>{
const SALT='5ae92ac74acfb6f1c3238946f35f9475', ITER=600000, STORE='adintel-key', DAYS=30;
const $=id=>document.getElementById(id);
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const say=(t,err)=>{const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'');};
function saved(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');
  if(s&&s.exp>Date.now())return s.k;localStorage.removeItem(STORE);}catch(e){}return null;}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:hex(SALT),iterations:ITER},base,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function open(kHex,ok){
  say('Downloading...');
  const buf=new Uint8Array(await (await fetch('d/app.bin?v='+Date.now(),{cache:'no-store'})).arrayBuffer());
  say('Unlocking...');
  const key=await crypto.subtle.importKey('raw',hex(kHex),'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(ok)ok();
  window.__AD_KEY=kHex;
  document.open();document.write(html);document.close();}
if(location.search.includes('logout')){try{localStorage.removeItem(STORE);}catch(e){}history.replaceState(null,'',location.pathname);}
const k0=saved();
if(k0)open(k0).catch(()=>{try{localStorage.removeItem(STORE);}catch(e){}say('Saved login expired - enter the password.',1);});
$('f').addEventListener('submit',async e=>{
  e.preventDefault();$('go').disabled=true;say('Checking...');
  const rem=$('rem').checked;
  try{const k=await derive($('pw').value);
    // Remember only once decryption has proven the password right - and before
    // document.write replaces this page (and the checkbox with it).
    await open(k,()=>{if(rem){try{localStorage.setItem(STORE,JSON.stringify({k,exp:Date.now()+DAYS*864e5}));}catch(e){}}});
  }catch(err){$('go').disabled=false;say(err&&err.name==='OperationError'?'Wrong password.':'Could not open: '+(err&&err.message||err),1);}
});
})();
</script>
</body></html>
